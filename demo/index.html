<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kite Desk demo (sample business)</title>
<style>:root{--bg:#0b0d18;--p:#141833;--l:#262b4d;--t:#e9ebf8}body{margin:0;padding:24px;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:0 auto}</style>
<link rel="stylesheet" href="demo.css"></head><body><section id="demo" class="wrap"><h2>Live demo (in your browser)</h2>
<p class="sub"><b>Demo, sample business:</b> “Demo Salon, Al Barsha” is fictional. This demo is rule-based, runs only in your browser, and sends no real WhatsApp messages. It is not connected to WhatsApp.</p>
<div class="kd-phone" role="region" aria-label="Kite Desk chat demo">
 <div class="kd-head"><div class="kd-av">DS</div><div>Demo Salon, Al Barsha<small>Demo, sample business</small></div><span class="kd-badge">DEMO</span></div>
 <div id="kd-log" aria-live="polite"></div>
 <div class="kd-quick"><button type="button" data-kd-quick="What are your hours?">Hours</button><button type="button" data-kd-quick="Prices?">Prices</button><button type="button" data-kd-quick="Where are you located?">Location</button><button type="button" data-kd-quick="I want to book">Book</button><button type="button" data-kd-quick="Talk to a human">Human</button></div>
 <form id="kd-form"><input id="kd-input" autocomplete="off" placeholder="Type a message" aria-label="Message"><button aria-label="Send">➤</button></form>
</div></section><script src="demo.js"></script></body></html>
